name: CI hello
on:
  pull_request:
    branches:
      - "snowcamp741"
  push:
    branches:
      - "snowcamp741"

jobs:
  CI:
    name: Publish hello app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Hello2
        uses: dagger/dagger-for-github@v8.2.0
        with:
          shell: container | from alpine | with-exec echo,"hello, world2!" | stdout
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
